agent_model: gemini-2.5-flash
agent_model_config:
  classification:
    model: gemini-2.5-flash
    provider: google
  embedded:
    model: gemini-2.5-flash
    provider: google
  hosting:
    model: gemini-2.5-flash
    provider: google
  landing:
    model: gemini-2.5-flash
    provider: google
  orchestrator:
    model: gemini-2.5-flash
    provider: google
agent_timeout_seconds: 300
browser_engine: puppeteer
browser_runtime:
  playwright:
    adblock_allowlist_hosts: []
    asset_diagnostics_enabled: true
    extra_launch_args: []
    fingerprint_fallback_strategy: profile
    fingerprint_recent_pool_size: 12
    fingerprint_rotation_interval_ms: 180000
    fingerprint_rotation_max_uses: 6
    fingerprint_rotation_mode: origin
    iframe_auto_recovery_enabled: true
    iframe_recovery_timeout_ms: 20000
    iframe_sandbox_patch_enabled: true
    launch_timeout_ms: 45000
    media_capture_timeout_ms: 30000
    media_cors_patch_enabled: false
    media_playback_verification_enabled: true
    media_proxy_strategy: direct_first
    media_retry_backoff_ms:
    - 1000
    - 2000
    - 4000
    media_retry_count: 3
    popup_blocking_enabled: true
    proxy_cache_ttl_ms: 600000
    proxy_custom_list: []
    proxy_enabled: false
    proxy_fallback_strategy: direct
    proxy_fetch_timeout_ms: 8000
    proxy_max_candidates: 25
    proxy_rotation_mode: session
    proxy_selection_strategy: ordered
    proxy_source_mode: hybrid
    proxy_source_order:
    - openproxylist-https
    - proxifly-http
    - monosans-http
    - speedx-http
    - openproxylist-socks5
    - proxifly-socks5
    - monosans-socks5
    - speedx-socks5
    - proxifly-socks4
    proxy_test_url: https://api.ipify.org?format=json
    proxy_validation_timeout_ms: 12000
    streaming_safe_mode: adaptive
    ubol_enabled: true
  puppeteer:
    adblock_allowlist_hosts: []
    asset_diagnostics_enabled: true
    extra_launch_args: []
    fingerprint_fallback_strategy: profile
    fingerprint_recent_pool_size: 12
    fingerprint_rotation_interval_ms: 180000
    fingerprint_rotation_max_uses: 6
    fingerprint_rotation_mode: origin
    iframe_auto_recovery_enabled: true
    iframe_recovery_timeout_ms: 20000
    iframe_sandbox_patch_enabled: true
    launch_timeout_ms: 45000
    media_capture_timeout_ms: 30000
    media_cors_patch_enabled: true
    media_playback_verification_enabled: true
    media_proxy_strategy: direct_first
    media_retry_backoff_ms:
    - 1000
    - 2000
    - 4000
    media_retry_count: 3
    popup_blocking_enabled: true
    proxy_cache_ttl_ms: 600000
    proxy_custom_list: []
    proxy_enabled: true
    proxy_fallback_strategy: direct
    proxy_fetch_timeout_ms: 8000
    proxy_max_candidates: 25
    proxy_rotation_mode: session
    proxy_selection_strategy: ordered
    proxy_source_mode: hybrid
    proxy_source_order:
    - openproxylist-https
    - proxifly-http
    - monosans-http
    - speedx-http
    - openproxylist-socks5
    - proxifly-socks5
    - monosans-socks5
    - speedx-socks5
    - proxifly-socks4
    proxy_test_url: https://api.ipify.org?format=json
    proxy_validation_timeout_ms: 12000
    stream_cors_include_credentials: false
    stream_cors_patch_enabled: false
    streaming_safe_mode: adaptive
    ubol_enabled: true
classification_max_tool_calls: 5
deepeval_model: google/gemma-4-31b-it:free
deepeval_provider: openrouter
deepeval_temperature: 0.0
disabled_tools_by_browser_profile:
  playwright:
    classification: []
    embedded: []
    hosting: []
    landing: []
  puppeteer:
    classification:
    - open_url
    - get_page_context
    - get_frame_tree
    - query_elements
    - get_element_detail
    - wait_for_page_state
    embedded:
    - get_frame_tree
    - get_element_detail
    - play_media
    - get_media_state
    - get_page_context
    - query_elements
    - open_url
    hosting:
    - get_page_context
    - query_elements
    - get_element_detail
    - get_frame_tree
    - wait_for_page_state
    - scroll_to_element
    - get_media_state
    - play_media
    landing:
    - get_page_context
    - query_elements
    - get_element_detail
    - get_frame_tree
    - open_url
    - wait_for_page_state
    - play_media
    - swipe_region
disabled_tools_by_profile: {}
embedded_page_max_tool_calls: 20
gemini_explicit_cache_enabled: true
gemini_explicit_cache_refresh_lead_seconds: 120
gemini_explicit_cache_ttl_seconds: 1800
gemini_temperature: 0.9
hosting_page_max_tool_calls: 20
ipinfo_token: ''
landing_page_max_tool_calls: 50
llm_provider: google
llm_tuning:
  agent_overrides:
    classification:
      max_tokens: 8192
      temperature: 1
      top_p: 0.95
    embedded:
      max_tokens: 8192
      temperature: 1
      top_p: 0.95
    hosting:
      max_tokens: 8192
      temperature: 1
      top_p: 0.95
    landing:
      max_tokens: 8192
      temperature: 1
      top_p: 0.95
    orchestrator:
      enable_thinking: 1
      max_tokens: 8192
      temperature: 1
      top_p: 0.95
  model_overrides:
    nvidia::minimaxai/minimax-m2.7:
      max_tokens: 8192
      temperature: 1
      top_p: 0.95
    openrouter::openrouter/free:
      temperature: 1
  provider_defaults:
    google:
      temperature: 1
    nvidia:
      temperature: 1
      top_p: 0.95
    openrouter:
      temperature: 1
log_file: data/logs/app.log
log_level: INFO
max_parallel_hosting_pages: 5
orchestrator_model: gemini-2.5-flash
provider_cache_enabled: true
thinking_budget_tokens: 8000
thinking_enabled: false
tool_result_cache_enabled: true
tool_result_cache_min_identical_observations: 2
tool_timeout_seconds: 30
