<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1160" viewBox="0 0 1680 1160" role="img" aria-labelledby="title desc">
  <title id="title">Open Web Catcher four-tier system architecture</title>
  <desc id="desc">A four-tier deployment view without Playwright. The presentation tier exposes the Next.js console on localhost port 3000. The application tier exposes FastAPI on port 8000 and contains LangGraph orchestration and the specialist agents. The browser-tool tier exposes the Puppeteer MCP service internally on port 3000, on host port 3001 for diagnostics, and Chrome DevTools on port 9222. The data tier exposes PostgreSQL internally on port 5432. External HTTPS services are shown outside the four deployment tiers.</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#f3f6fb"/>
    </linearGradient>
    <linearGradient id="navyPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152d59"/>
      <stop offset="1" stop-color="#0d1f42"/>
    </linearGradient>
    <linearGradient id="blueSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eaf1fb"/>
    </linearGradient>
    <linearGradient id="greenSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fcf9"/>
      <stop offset="1" stop-color="#e8f5ee"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0b1830" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7890b5"/>
    </marker>
    <style>
      .title { font: 700 48px "Agrandir Bold", "Agrandir", Arial, sans-serif; fill: #0c1c3a; letter-spacing: -1px; }
      .subtitle { font: 500 24px "Agrandir Medium", "Agrandir", Arial, sans-serif; fill: #60708c; }
      .tier-number { font: 700 23px "Agrandir Bold", "Agrandir", Arial, sans-serif; fill: #0c1c3a; }
      .tier-name { font: 500 17px "Agrandir Medium", "Agrandir", Arial, sans-serif; fill: #4e5c72; }
      .panel-title { font: 700 24px "Agrandir Bold", "Agrandir", Arial, sans-serif; fill: #0c1c3a; }
      .panel-title-light { font: 700 24px "Agrandir Bold", "Agrandir", Arial, sans-serif; fill: #ffffff; }
      .body { font: 400 17px "Agrandir", Arial, sans-serif; fill: #364158; }
      .body-light { font: 400 17px "Agrandir", Arial, sans-serif; fill: #e7edf8; }
      .endpoint { font: 600 16px "Agrandir Medium", "Agrandir", Arial, sans-serif; fill: #183a70; }
      .endpoint-light { font: 600 16px "Agrandir Medium", "Agrandir", Arial, sans-serif; fill: #f2f6ff; }
      .agent-title { font: 700 18px "Agrandir Bold", "Agrandir", Arial, sans-serif; fill: #14305d; }
      .agent-body { font: 400 15px "Agrandir", Arial, sans-serif; fill: #53627b; }
      .agent-endpoint { font: 600 14px "Agrandir Medium", "Agrandir", Arial, sans-serif; fill: #173a70; }
      .pill { font: 700 13px "Agrandir Bold", "Agrandir", Arial, sans-serif; fill: #31517f; letter-spacing: 0.7px; }
      .external-title { font: 700 20px "Agrandir Bold", "Agrandir", Arial, sans-serif; fill: #243753; }
      .external-body { font: 400 16px "Agrandir", Arial, sans-serif; fill: #5a6880; }
      .flow-label { font: 600 13px "Agrandir Medium", "Agrandir", Arial, sans-serif; fill: #617594; }
    </style>
  </defs>

  <rect width="1680" height="1160" fill="url(#pageBg)"/>

  <text x="44" y="66" class="title">OWC System Architecture</text>
  <text x="44" y="106" class="subtitle">4-tier deployment view · Puppeteer browser runtime</text>

  <!-- Tier labels -->
  <g filter="url(#shadow)">
    <rect x="44" y="146" width="198" height="152" rx="8" fill="#ffffff" stroke="#d5dce7"/>
    <rect x="44" y="324" width="198" height="286" rx="8" fill="#ffffff" stroke="#d5dce7"/>
    <rect x="44" y="636" width="198" height="184" rx="8" fill="#ffffff" stroke="#d5dce7"/>
    <rect x="44" y="846" width="198" height="170" rx="8" fill="#ffffff" stroke="#d5dce7"/>
  </g>

  <text x="68" y="186" class="tier-number">Tier 1</text>
  <text x="68" y="214" class="tier-name">Presentation</text>
  <text x="68" y="244" class="tier-name">Operator access</text>

  <text x="68" y="364" class="tier-number">Tier 2</text>
  <text x="68" y="392" class="tier-name">Application</text>
  <text x="68" y="422" class="tier-name">API · orchestration</text>
  <text x="68" y="452" class="tier-name">Specialist agents</text>

  <text x="68" y="676" class="tier-number">Tier 3</text>
  <text x="68" y="704" class="tier-name">Browser tools</text>
  <text x="68" y="734" class="tier-name">MCP · Chrome</text>

  <text x="68" y="886" class="tier-number">Tier 4</text>
  <text x="68" y="914" class="tier-name">Data</text>
  <text x="68" y="944" class="tier-name">Persistence</text>

  <!-- Tier 1 -->
  <g filter="url(#shadow)">
    <rect x="270" y="146" width="1364" height="152" rx="9" fill="#ffffff" stroke="#c9d3e1"/>
  </g>
  <rect x="294" y="169" width="118" height="26" rx="13" fill="#e8eff9"/>
  <text x="353" y="187" text-anchor="middle" class="pill">OWC-WEB</text>
  <text x="952" y="228" text-anchor="middle" class="panel-title">Operator Console (Next.js)</text>
  <text x="952" y="258" text-anchor="middle" class="body">Run launch · live trace · history · providers · settings</text>

  <!-- Flow 1 to 2 -->
  <path d="M 945 299 L 945 319" fill="none" stroke="#7890b5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="962" y="316" class="flow-label">HTTP / SSE</text>

  <!-- Tier 2 -->
  <g filter="url(#shadow)">
    <rect x="270" y="324" width="1364" height="286" rx="9" fill="url(#navyPanel)" stroke="#10264b"/>
  </g>
  <rect x="294" y="347" width="94" height="26" rx="13" fill="#29497a"/>
  <text x="341" y="365" text-anchor="middle" class="pill" fill="#ffffff" style="fill:#ffffff">OWC API</text>
  <text x="294" y="405" class="panel-title-light">FastAPI Backend + LangGraph Orchestrator</text>
  <text x="294" y="436" class="body-light">Run management · deterministic routing · agent dispatch · telemetry</text>
  <text x="916" y="374" class="body-light">Shared agent invocation endpoint</text>
  <text x="916" y="407" class="endpoint-light">POST /ui/agents/test</text>
  <text x="916" y="438" class="body-light">Body: {"agent":"hosting", "url":"https://…"}</text>
  <text x="916" y="466" class="body-light">Change the agent value to select the specialist.</text>

  <g>
    <rect x="294" y="489" width="305" height="92" rx="8" fill="#f8faff" stroke="#b9c8df"/>
    <rect x="615" y="489" width="305" height="92" rx="8" fill="#fffaf4" stroke="#dfb36f"/>
    <rect x="936" y="489" width="305" height="92" rx="8" fill="#f7faff" stroke="#9fb3d1"/>
    <rect x="1257" y="489" width="353" height="92" rx="8" fill="url(#greenSoft)" stroke="#88b49e"/>
    <text x="446.5" y="518" text-anchor="middle" class="agent-title">Classification Agent</text>
    <text x="446.5" y="543" text-anchor="middle" class="agent-endpoint">POST /classify</text>
    <text x="446.5" y="568" text-anchor="middle" class="agent-body">Body: {"url":"…"}</text>
    <text x="767.5" y="518" text-anchor="middle" class="agent-title">Landing Agent</text>
    <text x="767.5" y="543" text-anchor="middle" class="agent-endpoint">POST /extract</text>
    <text x="767.5" y="568" text-anchor="middle" class="agent-body">page_type: "landing_page"</text>
    <text x="1088.5" y="518" text-anchor="middle" class="agent-title">Hosting Agent</text>
    <text x="1088.5" y="543" text-anchor="middle" class="agent-endpoint">POST /extract</text>
    <text x="1088.5" y="568" text-anchor="middle" class="agent-body">page_type: "hosting_page"</text>
    <text x="1433.5" y="518" text-anchor="middle" class="agent-title">Embedded Agent</text>
    <text x="1433.5" y="543" text-anchor="middle" class="agent-endpoint">POST /extract</text>
    <text x="1433.5" y="568" text-anchor="middle" class="agent-body">page_type: "embedded_page"</text>
  </g>
  <text x="952" y="600" text-anchor="middle" class="body-light">There is no /classification-agent route; FastAPI constructs and runs each selected agent in-process.</text>

  <!-- Flow 2 to 3 -->
  <path d="M 945 611 L 945 631" fill="none" stroke="#7890b5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="962" y="628" class="flow-label">MCP calls</text>

  <!-- Tier 3 -->
  <g filter="url(#shadow)">
    <rect x="270" y="636" width="1364" height="184" rx="9" fill="url(#blueSoft)" stroke="#8fa6c7"/>
  </g>
  <rect x="294" y="660" width="132" height="26" rx="13" fill="#dce8f7"/>
  <text x="360" y="678" text-anchor="middle" class="pill">OWC-TOOLS</text>
  <text x="952" y="720" text-anchor="middle" class="panel-title">Browser Tool Service (Puppeteer MCP + Chrome)</text>
  <text x="952" y="751" text-anchor="middle" class="body">Inspect · interact · navigate · harvest · screenshot · media state</text>
  <text x="952" y="786" text-anchor="middle" class="body">Role-scoped browser profiles support the four agents while Chrome remains behind the MCP boundary.</text>

  <!-- Tier 4 -->
  <g filter="url(#shadow)">
    <rect x="270" y="846" width="1364" height="170" rx="9" fill="#ffffff" stroke="#c9d3e1"/>
  </g>
  <rect x="294" y="870" width="122" height="26" rx="13" fill="#e8eff9"/>
  <text x="355" y="888" text-anchor="middle" class="pill">POSTGRES</text>
  <text x="952" y="932" text-anchor="middle" class="panel-title">PostgreSQL Persistence</text>
  <text x="952" y="963" text-anchor="middle" class="body">Runs · background jobs · events · LLM/tool traces · evidence · datasets · pricing</text>

  <!-- External dependencies -->
  <rect x="270" y="1042" width="1364" height="82" rx="9" fill="#f7f8fb" stroke="#aeb9c9" stroke-dasharray="7 6"/>
  <text x="294" y="1075" class="external-title">External services — outside the four-tier deployment</text>
  <text x="294" y="1106" class="external-body">Gemini model API · Cloudinary screenshot storage/CDN · IPInfo, RDAP and WHOIS · investigated websites</text>
</svg>
