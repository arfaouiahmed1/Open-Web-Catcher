<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-label="Executive Dashboard Analytics Visualizations">
  <defs>
    <linearGradient id="an-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="340" rx="16" fill="#0b0f17" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Chart: 7-Day Spend & Volume Area Chart -->
  <g transform="translate(32, 28)">
    <rect width="520" height="284" rx="10" fill="url(#an-bg)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">7-Day Spend &amp; Token Volume Trend</text>
    <text x="20" y="48" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">Daily aggregated cost ($ USD) vs prompt/completion tokens</text>

    <!-- Chart Grid -->
    <g transform="translate(20, 70)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3"/>
      <line x1="0" y1="45" x2="480" y2="45" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3"/>
      <line x1="0" y1="90" x2="480" y2="90" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3"/>
      <line x1="0" y1="135" x2="480" y2="135" stroke="#334155" stroke-width="0.8"/>

      <!-- Smooth Area Path -->
      <path d="M 0 110 Q 80 80, 160 95 T 320 40 T 480 20 L 480 135 L 0 135 Z" fill="url(#area-grad)"/>
      <path d="M 0 110 Q 80 80, 160 95 T 320 40 T 480 20" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Token Line -->
      <path d="M 0 125 Q 80 110, 160 85 T 320 60 T 480 35" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 3"/>

      <!-- Dates Bottom -->
      <text x="0" y="155" fill="#64748b" font-family="monospace" font-size="10">Aug 29</text>
      <text x="150" y="155" fill="#64748b" font-family="monospace" font-size="10">Sep 01</text>
      <text x="310" y="155" fill="#64748b" font-family="monospace" font-size="10">Sep 03</text>
      <text x="440" y="155" fill="#38bdf8" font-family="monospace" font-size="10">Today</text>
    </g>

    <!-- Legend -->
    <g transform="translate(20, 252)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="16" y="10" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">Cost ($ USD)</text>
      <circle cx="120" cy="6" r="4" fill="#818cf8"/>
      <text x="130" y="10" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">Tokens (k)</text>
    </g>
  </g>

  <!-- Right Chart: Outcome Breakdown Donut -->
  <g transform="translate(572, 28)">
    <rect width="516" height="284" rx="10" fill="url(#an-bg)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">Run Outcome Distribution</text>
    <text x="20" y="48" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">Completed execution status across verified domains</text>

    <!-- Donut Graphic -->
    <g transform="translate(110, 160)">
      <!-- Donut segments -->
      <circle r="65" fill="none" stroke="#10b981" stroke-width="24" stroke-dasharray="290 120" transform="rotate(-90)"/>
      <circle r="65" fill="none" stroke="#38bdf8" stroke-width="24" stroke-dasharray="80 330" stroke-dashoffset="-290" transform="rotate(-90)"/>
      <circle r="65" fill="none" stroke="#f59e0b" stroke-width="24" stroke-dasharray="30 380" stroke-dashoffset="-370" transform="rotate(-90)"/>

      <!-- Center Total -->
      <text x="0" y="-4" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="20" font-weight="800">42</text>
      <text x="0" y="14" text-anchor="middle" fill="#64748b" font-family="-apple-system,sans-serif" font-size="9" text-transform="uppercase" letter-spacing="0.1em">RUNS</text>
    </g>

    <!-- Donut Legend Right -->
    <g transform="translate(240, 95)">
      <g transform="translate(0, 0)">
        <rect width="12" height="12" rx="3" fill="#10b981"/>
        <text x="20" y="10" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">Success / Streams Verified</text>
        <text x="20" y="24" fill="#64748b" font-family="monospace" font-size="11">32 runs · 76.2%</text>
      </g>
      <g transform="translate(0, 42)">
        <rect width="12" height="12" rx="3" fill="#38bdf8"/>
        <text x="20" y="10" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">Partial / Handoff Found</text>
        <text x="20" y="24" fill="#64748b" font-family="monospace" font-size="11">7 runs · 16.7%</text>
      </g>
      <g transform="translate(0, 84)">
        <rect width="12" height="12" rx="3" fill="#f59e0b"/>
        <text x="20" y="10" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-size="12" font-weight="600">No Streams / Inactive Match</text>
        <text x="20" y="24" fill="#64748b" font-family="monospace" font-size="11">3 runs · 7.1%</text>
      </g>
    </g>
  </g>
</svg>
