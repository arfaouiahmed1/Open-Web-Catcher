      <text x="14" y="20" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">Embedded Player</text>
      <text x="120" y="20" fill="#38bdf8" font-family="monospace" font-size="10">Override · anthropic / claude-3-5-sonnet</text>
