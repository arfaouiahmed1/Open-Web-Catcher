<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Open Web Catcher logical agent workflow</title>
  <desc id="desc">A custom SVG diagram showing operator request, FastAPI background job, orchestrator, specialist agents, provider analysis, email drafting, Postgres, and Next.js run detail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:url(#bg)}
      .group{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4}
      .node{fill:#ffffff;stroke:#334155;stroke-width:1.6}
      .accent{fill:#ecfeff;stroke:#0e7490}
      .agent{fill:#f8fafc;stroke:#475569}
      .terminal{fill:#fff7ed;stroke:#c2410c}
      .data{fill:#f0fdf4;stroke:#15803d}
      .title{font:700 22px Arial, sans-serif;fill:#0f172a}
      .label{font:700 14px Arial, sans-serif;fill:#0f172a}
      .small{font:12px Arial, sans-serif;fill:#475569}
      .tiny{font:11px Arial, sans-serif;fill:#64748b}
      .edge{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="610" rx="20"/>
  <text class="title" x="36" y="44">Logical agent workflow</text>
  <text class="small" x="36" y="68">Deterministic routing around bounded browser-agent contracts</text>

  <rect class="group" x="28" y="92" width="224" height="160" rx="14"/>
  <text class="label" x="48" y="122">Operator entry</text>
  <rect class="node accent" x="52" y="146" width="160" height="42" rx="9"/>
  <text class="label" x="82" y="172">Next.js console</text>
  <text class="tiny" x="73" y="207">/live, /runs, /settings</text>
  <text class="tiny" x="63" y="225">launch + inspect workflows</text>

  <rect class="group" x="296" y="92" width="236" height="160" rx="14"/>
  <text class="label" x="316" y="122">Execution backend</text>
  <rect class="node" x="330" y="145" width="168" height="42" rx="9"/>
  <text class="label" x="364" y="171">FastAPI</text>
  <text class="tiny" x="343" y="207">background job + RunObserver</text>
  <text class="tiny" x="350" y="225">SSE and UI contracts</text>

  <rect class="group" x="576" y="82" width="504" height="346" rx="16"/>
  <text class="label" x="598" y="114">Orchestrator LangGraph</text>
  <rect class="node accent" x="610" y="138" width="150" height="48" rx="10"/>
  <text class="label" x="638" y="167">Classify</text>
  <rect class="node agent" x="610" y="230" width="150" height="54" rx="10"/>
  <text class="label" x="646" y="252">Landing</text>
  <text class="tiny" x="632" y="270">find candidates</text>
  <rect class="node agent" x="800" y="206" width="150" height="54" rx="10"/>
  <text class="label" x="838" y="228">Hosting</text>
  <text class="tiny" x="826" y="246">server controls</text>
  <rect class="node agent" x="800" y="302" width="150" height="54" rx="10"/>
  <text class="label" x="834" y="324">Embedded</text>
  <text class="tiny" x="830" y="342">iframe/player</text>
  <rect class="node terminal" x="610" y="340" width="150" height="54" rx="10"/>
  <text class="label" x="633" y="362">No evidence</text>
  <text class="tiny" x="629" y="380">skip provider/email</text>
  <rect class="node data" x="980" y="230" width="76" height="102" rx="10"/>
  <text class="label" x="994" y="258">Streams</text>
  <text class="tiny" x="997" y="279">m3u8</text>
  <text class="tiny" x="1000" y="296">mpd</text>
  <text class="tiny" x="1000" y="313">mp4</text>

  <rect class="group" x="576" y="468" width="504" height="102" rx="14"/>
  <text class="label" x="598" y="500">Post-extraction stages</text>
  <rect class="node" x="770" y="516" width="132" height="36" rx="8"/>
  <text class="small" x="795" y="539">Provider lookup</text>
  <rect class="node" x="928" y="516" width="112" height="36" rx="8"/>
  <text class="small" x="952" y="539">Email draft</text>

  <rect class="group" x="28" y="408" width="504" height="162" rx="14"/>
  <text class="label" x="48" y="440">Persistence and read model</text>
  <rect class="node data" x="64" y="468" width="140" height="56" rx="10"/>
  <text class="label" x="98" y="492">Postgres</text>
  <text class="tiny" x="82" y="510">evidence + telemetry</text>
  <rect class="node" x="244" y="468" width="152" height="56" rx="10"/>
  <text class="label" x="272" y="492">Run detail API</text>
  <text class="tiny" x="267" y="510">GET /ui/runs/{id}</text>

  <path class="edge" d="M212 167 C250 167 288 167 330 167"/>
  <path class="edge" d="M498 167 C532 167 564 163 610 162"/>
  <path class="edge" d="M685 186 L685 230"/>
  <path class="edge" d="M760 256 C776 248 783 240 800 234"/>
  <path class="edge" d="M950 233 C963 244 970 256 980 273"/>
  <path class="edge" d="M875 260 L875 302"/>
  <path class="edge" d="M950 329 C963 316 971 301 980 285"/>
  <path class="soft" d="M685 186 L685 340"/>
  <path class="edge" d="M1018 332 C1018 408 918 468 850 516"/>
  <path class="edge" d="M902 534 L928 534"/>
  <path class="edge" d="M836 552 C690 590 368 560 204 505"/>
  <path class="edge" d="M204 496 L244 496"/>
  <path class="soft" d="M320 468 C386 370 442 264 576 180"/>
</svg>
