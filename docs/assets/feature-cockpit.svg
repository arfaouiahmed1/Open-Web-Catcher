      <text x="210" y="17" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">Reasoning &amp; LLM</text>
      <text x="325" y="17" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">Streams (3)</text>
      <text x="410" y="17" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">Event Feed</text>
      <text x="500" y="17" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">Costs &amp; Context</text>
