      <text x="10" y="35" fill="#38bdf8" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">Orchestrator</text>
      
      <!-- Arrow -->
      <line x1="85" y1="32" x2="105" y2="32" stroke="#38bdf8" stroke-width="1.5"/>
      
      <!-- Classify -->
