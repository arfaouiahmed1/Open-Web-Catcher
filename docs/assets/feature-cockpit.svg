    <text x="20" y="24" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11">Console &gt; Runs &gt; <tspan fill="#38bdf8" font-family="monospace">d8057728-8594-4580-967a</tspan></text>
    
    <rect x="20" y="32" width="76" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="32" y="47" fill="#10b981" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">SUCCESS</text>
    
    <text x="108" y="48" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="16" font-weight="700">https://freeshot.live/live-tv</text>
    
    <g transform="translate(900, 18)">
      <rect width="70" height="28" rx="6" fill="#334155" fill-opacity="0.6" stroke="#475569" stroke-width="1"/>
      <text x="14" y="18" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-size="11">Refresh</text>
      <rect x="80" y="0" width="70" height="28" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="96" y="18" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="11" font-weight="600">Restart</text>
    </g>
  </g>

  <!-- 6-Tile KPI Ribbon -->
  <g transform="translate(24, 96)">
    <!-- Tile 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">ESTIMATED COST</text>
      <text x="14" y="44" fill="#10b981" font-family="monospace" font-size="16" font-weight="700">$0.008</text>
    </g>
    <!-- Tile 2 -->
    <g transform="translate(180, 0)">
      <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">DURATION</text>
      <text x="14" y="44" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">18.4s</text>
    </g>
    <!-- Tile 3 -->
    <g transform="translate(360, 0)">
      <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">TOTAL TOKENS</text>
      <text x="14" y="44" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">34,120</text>
    </g>
    <!-- Tile 4 -->
    <g transform="translate(540, 0)">
      <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">TOOL CALLS</text>
      <text x="14" y="44" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="700">12 executions</text>
    </g>
    <!-- Tile 5 -->
    <g transform="translate(720, 0)">
      <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">CAPTURED STREAMS</text>
      <text x="14" y="44" fill="#10b981" font-family="monospace" font-size="16" font-weight="700">3 verified</text>
    </g>
    <!-- Tile 6 -->
    <g transform="translate(900, 0)">
      <rect width="172" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">SCREENSHOTS</text>
      <text x="14" y="44" fill="#c084fc" font-family="monospace" font-size="16" font-weight="700">6 frames</text>
    </g>
  </g>

  <!-- Left: Main Panel Tabs -->
  <g transform="translate(24, 172)">
