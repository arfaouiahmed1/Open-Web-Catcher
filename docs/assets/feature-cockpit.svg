      <text x="220" y="28" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="10" font-weight="700">Hosting</text>
      <text x="220" y="44" fill="#38bdf8" font-family="monospace" font-size="9">6 tools · 14.1s</text>

      <!-- Arrow -->
      <line x1="305" y1="32" x2="325" y2="32" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Embedded -->
      <rect x="325" y="15" width="70" height="34" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="335" y="35" fill="#c084fc" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">Embed</text>
    </g>

    <!-- Inspector Drawer Preview -->
    <g transform="translate(16, 115)">
      <rect width="384" height="190" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="8" y="8" width="110" height="20" rx="4" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="14" y="22" fill="#38bdf8" font-family="-apple-system,sans-serif" font-size="9" font-weight="700">HOSTING INSPECTOR</text>

      <!-- Sub Tabs -->
      <text x="14" y="44" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-size="10" font-weight="600">Tools (6) · Reasoning · Artifacts (3)</text>
      <line x1="14" y1="52" x2="370" y2="52" stroke="#334155" stroke-width="0.8"/>

      <g transform="translate(14, 62)">
        <text x="0" y="10" fill="#38bdf8" font-family="monospace" font-size="10">navigate(action: "open", url: "...")</text>
        <text x="0" y="22" fill="#64748b" font-family="-apple-system,sans-serif" font-size="9">200 OK · Duration: 2.1s · Page loaded</text>

        <text x="0" y="42" fill="#38bdf8" font-family="monospace" font-size="10">inspect(action: "detect_servers")</text>
        <text x="0" y="54" fill="#64748b" font-family="-apple-system,sans-serif" font-size="9">Found 4 server buttons: [Server 1, Server 2, HD-1, HD-2]</text>

        <text x="0" y="74" fill="#38bdf8" font-family="monospace" font-size="10">interact(action: "click", selector: "#btn-s1")</text>
        <text x="0" y="86" fill="#64748b" font-family="-apple-system,sans-serif" font-size="9">Activated iframe player embed: //player.streamv.net/embed/412</text>

        <text x="0" y="106" fill="#10b981" font-family="monospace" font-size="10">harvest(action: "media_requests")</text>
        <text x="0" y="118" fill="#10b981" font-family="-apple-system,sans-serif" font-size="9">Captured 3 playable stream URLs</text>
      </g>
    </g>
