      <text x="12" y="150" fill="#64748b" font-family="monospace" font-size="9">HTML5 Video Player Frame</text>
      
      <!-- Telemetry log right -->
      <g transform="translate(245, 14)">
        <text x="0" y="12" fill="#38bdf8" font-family="monospace" font-size="10">00:04.2 [navigate] focus embedded iframe</text>
        <text x="0" y="32" fill="#10b981" font-family="monospace" font-size="10">00:08.1 [interact] click button#vplayer-play</text>
        <text x="0" y="52" fill="#f59e0b" font-family="monospace" font-size="10">00:09.4 [defense] uBOL blocked 4 ad popups</text>
        <text x="0" y="72" fill="#38bdf8" font-family="monospace" font-size="10">00:11.8 [harvest] captured .m3u8 playlist manifest</text>
        <text x="0" y="92" fill="#10b981" font-family="monospace" font-size="10">00:14.0 [verify] sample 65KB chunk OK - SHA256 validated</text>
      </g>
    </g>
  </g>

  <!-- Right: Agent Run Graph & Deep Inspector -->
  <g transform="translate(680, 172)">
    <rect width="416" height="324" rx="10" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="28" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">Agent Execution Graph</text>
    <text x="320" y="28" fill="#38bdf8" font-family="-apple-system,sans-serif" font-size="10">Inspect node &gt;</text>

    <!-- Mini Topology -->
