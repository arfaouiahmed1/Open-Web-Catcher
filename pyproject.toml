[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-web-catcher"
version = "0.1.0"
description = "Multi-agent AI pipeline for extracting streaming URLs from illegal streaming websites"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.1",
    "litellm>=1.53",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",
    "cloudinary>=1.40",
    "psycopg2-binary>=2.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
browser-prepass = [
    "scrapling[fetchers]==0.4.15",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "httpx>=0.27",
    "warcio==1.8.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
markers = [
    "unit: fast isolated tests with no external services",
    "integration: tests crossing module or storage boundaries",
    "replay: tests replaying recorded interactions",
    "slow: long-running tests excluded from quick loops",
]

[project.scripts]
open-web-catcher = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
