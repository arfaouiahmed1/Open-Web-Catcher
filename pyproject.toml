[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "open-web-catcher"
version = "0.1.0"
description = "Multi-agent AI pipeline for extracting streaming URLs from illegal streaming websites"
requires-python = ">=3.11"
dependencies = [
    # LLM client + tracing
    "langchain-core>=0.3",          # BaseMessage, BaseTool, ToolMessage
    "langchain-google-genai>=2.0",  # ChatGoogleGenerativeAI + bind_tools
    "langgraph>=0.2",               # StateGraph for the orchestrator only
    "langchain-mcp-adapters>=0.1",   # MCP → LangChain BaseTool bridge
    "langsmith>=0.1",               # optional tracing

    # Pydantic / settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Storage
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Cloudinary (image upload for vision)
    "cloudinary>=1.40",

    # Database driver (PostgreSQL)
    "psycopg2-binary>=2.9",

    # API + UI
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gradio>=4.36",

    # CLI
    "typer>=0.12",
    "rich>=13.7",

    # Utilities
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[project.scripts]
open-web-catcher = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
