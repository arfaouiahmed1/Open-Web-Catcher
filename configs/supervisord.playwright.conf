[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord-playwright.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord-playwright.pid

; 1. Shared Chrome fallback for MCP health checks and legacy workflows
[program:chrome]
command=/usr/local/bin/google-chrome-stable
    --headless=new
    --no-sandbox
    --disable-dev-shm-usage
    --disable-gpu
    --disable-extensions
    --remote-debugging-port=9223
    --remote-debugging-address=0.0.0.0
    --user-data-dir=/tmp/chrome-profile-pw
    about:blank
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/app/data/logs/chrome-pw.log
stderr_logfile=/app/data/logs/chrome-pw.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; 2. Playwright MCP tool server
[program:mcp-playwright]
command=node /app/tools/playwright/mcp-server.js
directory=/app/tools/playwright
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=5
stdout_logfile=/app/data/logs/mcp-playwright.log
stderr_logfile=/app/data/logs/mcp-playwright.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[group:owc-playwright]
programs=chrome,mcp-playwright
