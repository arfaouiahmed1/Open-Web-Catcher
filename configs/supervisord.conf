[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

; 1. FastAPI / uvicorn
[program:api]
command=/app/.venv/bin/uvicorn src.api.app:app
    --host 0.0.0.0
    --port 8000
    --log-level info
    --no-access-log
directory=/app
autostart=true
autorestart=true
priority=10
startsecs=5
startretries=3
stdout_logfile=/app/data/logs/api.log
stderr_logfile=/app/data/logs/api.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB

[group:owc]
programs=api
