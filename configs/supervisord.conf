[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

; ── 1. Google Chrome (headless DevTools server) ───────────────────────────────
[program:chrome]
command=google-chrome-stable
    --headless=new
    --no-sandbox
    --disable-dev-shm-usage
    --disable-gpu
    --disable-extensions
    --remote-debugging-port=9222
    --remote-debugging-address=0.0.0.0
    --user-data-dir=/tmp/chrome-profile
    about:blank
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/app/data/logs/chrome.log
stderr_logfile=/app/data/logs/chrome.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; ── 2. MCP tool server (Node.js, waits for Chrome) ───────────────────────────
[program:mcp]
command=node /app/tools_js/mcp-server.js
directory=/app/tools_js
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=5
stdout_logfile=/app/data/logs/mcp.log
stderr_logfile=/app/data/logs/mcp.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── 3. FastAPI / uvicorn ──────────────────────────────────────────────────────
[program:api]
command=/app/.venv/bin/uvicorn src.api.app:app
    --host 0.0.0.0
    --port 8000
    --log-level info
    --no-access-log
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=3
stdout_logfile=/app/data/logs/api.log
stderr_logfile=/app/data/logs/api.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB

; ── 4. Gradio dashboard ───────────────────────────────────────────────────────
[program:gradio]
command=/app/.venv/bin/python -m src.api.gradio_app
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=3
stdout_logfile=/app/data/logs/gradio.log
stderr_logfile=/app/data/logs/gradio.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── Group: all web services ───────────────────────────────────────────────────
[group:owc]
programs=chrome,mcp,api,gradio
