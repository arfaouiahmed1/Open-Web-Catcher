[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord-tools.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

; 1. Shared Chrome fallback for MCP health checks and legacy workflows
[program:chrome]
command=/usr/local/bin/google-chrome-stable
    --headless=new
    --no-sandbox
    --disable-dev-shm-usage
    --disable-gpu
    --disable-extensions
    --remote-debugging-port=9222
    --remote-debugging-address=0.0.0.0
    --user-data-dir=/tmp/chrome-profile
    about:blank
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/app/data/logs/chrome.log
stderr_logfile=/app/data/logs/chrome.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; 2. MCP tool server
[program:mcp]
command=node /app/tools_js/mcp-server.js
directory=/app/tools_js
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=5
stdout_logfile=/app/data/logs/mcp.log
stderr_logfile=/app/data/logs/mcp.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[group:owc-tools]
programs=chrome,mcp
