[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord-tools.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

; 1. Browser debugger proxy exposed on the public port expected by the stack.
[program:browser-proxy]
command=node /app/scripts/docker/browser-proxy.js 9222 9332
autostart=true
autorestart=true
priority=5
startsecs=1
stdout_logfile=/app/data/logs/browser-proxy.log
stderr_logfile=/app/data/logs/browser-proxy.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; 2. Shared Chrome fallback for MCP health checks and legacy workflows
[program:chrome]
command=/app/scripts/docker/start-shared-puppeteer-chrome.sh
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/app/data/logs/chrome.log
stderr_logfile=/app/data/logs/chrome.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; 3. MCP tool server
[program:mcp]
command=node /app/tools/puppeteer/mcp-server.js
directory=/app/tools/puppeteer
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=5
stdout_logfile=/app/data/logs/mcp.log
stderr_logfile=/app/data/logs/mcp.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[group:owc-tools]
programs=browser-proxy,chrome,mcp
