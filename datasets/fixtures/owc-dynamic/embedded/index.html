<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedded Player</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #video { width: 100%; height: 100%; display: block; object-fit: contain; }
    #play-trigger { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); cursor: pointer; }
    #btn { background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 70px; height: 70px; font-size: 28px; cursor: pointer; }
  </style>
</head>
<body>
  <video id="video" playsinline controls src="http://embedded.owc.test/hls/live.m3u8"></video>
  <div id="play-trigger" onclick="play()">
    <button id="btn">▶</button>
  </div>
  <script>
    function play() {
      document.getElementById('play-trigger').style.display = 'none';
      const v = document.getElementById('video');
      fetch('http://embedded.owc.test/hls/live.m3u8').catch(() => {});
      v.play().catch(() => {});
    }
  </script>
</body>
</html>
