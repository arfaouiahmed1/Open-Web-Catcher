name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.11-

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DATABASE_URL: "sqlite:///:memory:"
          BROWSER_WS_ENDPOINT: "ws://localhost:9222"
          GOOGLE_API_KEY: "test-key"
          MEMORY_ENABLED: "false"
          OBSERVABILITY_ENABLED: "false"
          PROVIDER_PRICING_SYNC_ENABLED: "false"
        run: uv run pytest -p pytest_asyncio.plugin -m "not deepeval" tests/ --tb=short -q

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: CI=1 npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  tools-js-tests:
    name: Tools JS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/puppeteer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/puppeteer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
