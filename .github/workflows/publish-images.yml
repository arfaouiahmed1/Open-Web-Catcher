name: Publish Container Images to GHCR

on:
  push:
    branches:
      - main
      - master
      - feat/operator-hardening
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image-name: open-web-catcher
            build-args: ""
          - dockerfile: Dockerfile.web
            image-name: open-web-catcher-web
            build-args: "NEXT_PUBLIC_API_BASE_URL=http://localhost:8000"
          - dockerfile: Dockerfile.tools.playwright
            image-name: open-web-catcher-tools-playwright
            build-args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for image tags
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> "${GITHUB_OUTPUT}"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image-name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/operator-hardening' }}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
