version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # Next.js web app
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(web)"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    ignore:
      # Keep major React/Next updates for manual review
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Puppeteer MCP tools
  - package-ecosystem: "npm"
    directory: "/tools/puppeteer"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(tools)"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5

  # Python backend
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(python)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
