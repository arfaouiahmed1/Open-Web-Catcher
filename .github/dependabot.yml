version: 2

updates:
  # Python backend dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(python)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  # Operator console (web/package.json)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(web)"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    ignore:
      # Keep major React/Next updates for manual review
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Playwright MCP browser tools (tools/playwright/package.json)
  - package-ecosystem: "npm"
    directory: "/tools/playwright"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(tools)"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5

  # Puppeteer MCP tools (legacy stack, pending ADR-003 consolidation)
  - package-ecosystem: "npm"
    directory: "/tools/puppeteer"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(tools)"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "docker"
