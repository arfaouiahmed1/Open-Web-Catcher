# Open Web Catcher app stack with Playwright MCP tooling and Next.js operator console.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owc}
      # Required, no weak default: compose fails fast when unset (set it in .env).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_must_be_set_in_.env}
      POSTGRES_DB: ${POSTGRES_DB:-owc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owc} -d ${POSTGRES_DB:-owc}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    # Run-state store only: internal network, never host-published (plan T17/ADR-002).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: '0.5'
        reservations:
          memory: 128m

  owc-tools-playwright:
    image: ${OWC_TOOLS_PW_IMAGE:-open-web-catcher-tools-playwright}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.tools.playwright
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_TOOLS_PW_CONTAINER:-owc-tools-playwright}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    shm_size: "2gb"
    ports:
      - "${OWC_TOOLS_PW_HOST_PORT:-3002}:3001"
      - "${OWC_TOOLS_PW_DEBUG_HOST_PORT:-9223}:9223"
    env_file:
      - .env
    environment:
      PORT: 3001
      MCP_BROWSER_MODE: ${MCP_BROWSER_MODE:-isolated}
      BROWSER_WS_ENDPOINT: ws://127.0.0.1:9223
      OWC_UBOL_ENABLED: ${OWC_UBOL_ENABLED:-true}
      OWC_UBOL_EXTENSION_DIR: ${OWC_UBOL_EXTENSION_DIR_PLAYWRIGHT:-/app/tools/playwright/extensions/ubol}
      OWC_UBOL_EXTENSION_ID: ${OWC_UBOL_EXTENSION_ID:-nkeimhogjdpnpccoofpliimaahmaaome}
      OWC_UBOL_DEFAULT_FILTERING: ${OWC_UBOL_DEFAULT_FILTERING:-optimal}
      OWC_ADBLOCK_ALLOWLIST_HOSTS: ${OWC_ADBLOCK_ALLOWLIST_HOSTS:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '3.0'
        reservations:
          memory: 1g

  # Opt-in headed Playwright tools under Xvfb: `docker compose --profile headed-playwright up`.
  # Same image as owc-tools-playwright with OWC_BROWSER_HEADLESS=false; host
  # ports offset (3012/9323) so the default headless service keeps 3002/9223.
  owc-tools-playwright-headed:
    image: ${OWC_TOOLS_PW_IMAGE:-open-web-catcher-tools-playwright}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.tools.playwright
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_TOOLS_PW_HEADED_CONTAINER:-owc-tools-playwright-headed}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    shm_size: "2gb"
    profiles:
      - headed-playwright
    ports:
      - "${OWC_TOOLS_PW_HEADED_HOST_PORT:-3012}:3001"
      - "${OWC_TOOLS_PW_HEADED_DEBUG_HOST_PORT:-9323}:9223"
    env_file:
      - .env
    environment:
      PORT: 3001
      MCP_BROWSER_MODE: ${MCP_BROWSER_MODE:-isolated}
      BROWSER_WS_ENDPOINT: ws://127.0.0.1:9223
      OWC_BROWSER_HEADLESS: "false"
      OWC_XVFB_SCREEN: ${OWC_XVFB_SCREEN:-1280x800x24}
      OWC_UBOL_ENABLED: ${OWC_UBOL_ENABLED:-true}
      OWC_UBOL_EXTENSION_DIR: ${OWC_UBOL_EXTENSION_DIR_PLAYWRIGHT:-/app/tools/playwright/extensions/ubol}
      OWC_UBOL_EXTENSION_ID: ${OWC_UBOL_EXTENSION_ID:-nkeimhogjdpnpccoofpliimaahmaaome}
      OWC_UBOL_DEFAULT_FILTERING: ${OWC_UBOL_DEFAULT_FILTERING:-optimal}
      OWC_ADBLOCK_ALLOWLIST_HOSTS: ${OWC_ADBLOCK_ALLOWLIST_HOSTS:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '3.0'
        reservations:
          memory: 1g

  owc:
    image: ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_CONTAINER:-owc}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BROWSER_WS_ENDPOINT: ws://owc-tools-playwright:9223
      MCP_SERVER_URL: http://owc-tools-playwright:3001
      MCP_SERVER_URL_PLAYWRIGHT: http://owc-tools-playwright:3001
      # Composed from the required POSTGRES_PASSWORD (no baked owc:owc creds).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-owc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_must_be_set_in_.env}@postgres:5432/${POSTGRES_DB:-owc}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OBSERVABILITY_PROJECT_NAME: ${OBSERVABILITY_PROJECT_NAME:-open-web-catcher}
      OBSERVABILITY_DEFAULT_DATASET_NAME: ${OBSERVABILITY_DEFAULT_DATASET_NAME:-open-web-catcher-runs}
      OBSERVABILITY_DATASET_DIR: ${OBSERVABILITY_DATASET_DIR:-data/datasets}
      MODEL_PRICING_JSON: ${MODEL_PRICING_JSON:-{}}
      UI_CORS_ORIGINS: ${UI_CORS_ORIGINS:-http://localhost:${OWC_WEB_HOST_PORT:-3000},http://127.0.0.1:${OWC_WEB_HOST_PORT:-3000}}
    depends_on:
      postgres:
        condition: service_healthy
      owc-tools-playwright:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./datasets:/app/datasets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: '2.0'
        reservations:
          memory: 512m

  owc-web:
    image: ${OWC_WEB_IMAGE:-open-web-catcher-web}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_WEB_CONTAINER:-owc-web}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "${OWC_WEB_HOST_PORT:-3000}:3001"
    environment:
      API_BASE_URL: http://owc:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      owc:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 128m

volumes:
  postgres_data:
