# Open Web Catcher app container plus a lightweight Phoenix sidecar for tracing.

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

  owc:
    image: ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    container_name: ${OWC_CONTAINER:-owc}
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "8000:8000"
      - "7860:7860"
    env_file:
      - .env
    environment:
      BROWSER_WS_ENDPOINT: ws://localhost:9222
      MCP_SERVER_URL: http://localhost:3000
      DATABASE_URL: postgresql+psycopg2://owc:owc@localhost:5432/owc
      PHOENIX_TRACING: ${PHOENIX_TRACING:-true}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-open-web-catcher}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT_DOCKER:-http://phoenix:6006}
      PHOENIX_UI_URL: ${PHOENIX_UI_URL:-http://localhost:6006}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    depends_on:
      phoenix:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  phoenix_data:
