# Open Web Catcher app stack with separate Puppeteer/MCP tooling and Next.js operator console.

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owc}
      POSTGRES_DB: ${POSTGRES_DB:-owc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owc} -d ${POSTGRES_DB:-owc}"]
      interval: 10s
      timeout: 5s
      retries: 10

  owc-tools:
    image: ${OWC_TOOLS_IMAGE:-open-web-catcher-tools}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.tools
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_TOOLS_CONTAINER:-owc-tools}
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "3000:3000"
      - "9222:9222"
    env_file:
      - .env
    environment:
      PORT: 3000
      MCP_BROWSER_MODE: ${MCP_BROWSER_MODE:-isolated}
      BROWSER_WS_ENDPOINT: ws://127.0.0.1:9222
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/google-chrome-stable
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      OWC_UBOL_ENABLED: ${OWC_UBOL_ENABLED:-true}
      OWC_UBOL_EXTENSION_DIR: ${OWC_UBOL_EXTENSION_DIR:-/app/tools/puppeteer/extensions/ubol}
      OWC_UBOL_DEFAULT_FILTERING: ${OWC_UBOL_DEFAULT_FILTERING:-optimal}
      OWC_ADBLOCK_ENABLED: ${OWC_ADBLOCK_ENABLED:-false}
      OWC_ADBLOCK_EXCLUDED_CATEGORIES: ${OWC_ADBLOCK_EXCLUDED_CATEGORIES:-nsfw,gambling}
      OWC_ADBLOCK_ALLOWLIST_HOSTS: ${OWC_ADBLOCK_ALLOWLIST_HOSTS:-}
      OWC_ADBLOCK_AUTO_RECOVERY_ENABLED: ${OWC_ADBLOCK_AUTO_RECOVERY_ENABLED:-true}
      OWC_ADBLOCK_AUTO_RECOVERY_ON_ABORT: ${OWC_ADBLOCK_AUTO_RECOVERY_ON_ABORT:-true}
      OWC_ADBLOCK_AUTO_RECOVERY_RETRY: ${OWC_ADBLOCK_AUTO_RECOVERY_RETRY:-true}
      OWC_ENABLE_STREAM_CORS_PATCH: ${OWC_ENABLE_STREAM_CORS_PATCH:-false}
      OWC_STREAM_CORS_INCLUDE_CREDENTIALS: ${OWC_STREAM_CORS_INCLUDE_CREDENTIALS:-false}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  owc-tools-playwright:
    image: ${OWC_TOOLS_PW_IMAGE:-open-web-catcher-tools-playwright}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.tools.playwright
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_TOOLS_PW_CONTAINER:-owc-tools-playwright}
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "3002:3001"
      - "9223:9223"
    env_file:
      - .env
    environment:
      PORT: 3001
      MCP_BROWSER_MODE: ${MCP_BROWSER_MODE:-isolated}
      BROWSER_WS_ENDPOINT: ws://127.0.0.1:9223
      OWC_ADBLOCK_ENABLED: ${OWC_ADBLOCK_ENABLED:-true}
      OWC_ADBLOCK_EXCLUDED_CATEGORIES: ${OWC_ADBLOCK_EXCLUDED_CATEGORIES:-nsfw,gambling}
      OWC_ADBLOCK_ALLOWLIST_HOSTS: ${OWC_ADBLOCK_ALLOWLIST_HOSTS:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  owc:
    image: ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_CONTAINER:-owc}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BROWSER_WS_ENDPOINT: ws://owc-tools:9222
      MCP_SERVER_URL: http://owc-tools:3000
      MCP_SERVER_URL_PUPPETEER: http://owc-tools:3000
      MCP_SERVER_URL_PLAYWRIGHT: http://owc-tools-playwright:3001
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-owc}:${POSTGRES_PASSWORD:-owc}@postgres:5432/${POSTGRES_DB:-owc}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OBSERVABILITY_PROJECT_NAME: ${OBSERVABILITY_PROJECT_NAME:-open-web-catcher}
      OBSERVABILITY_DEFAULT_DATASET_NAME: ${OBSERVABILITY_DEFAULT_DATASET_NAME:-open-web-catcher-runs}
      OBSERVABILITY_DATASET_DIR: ${OBSERVABILITY_DATASET_DIR:-data/datasets}
      MODEL_PRICING_JSON: ${MODEL_PRICING_JSON:-{}}
      UI_CORS_ORIGINS: ${UI_CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
    depends_on:
      postgres:
        condition: service_healthy
      owc-tools:
        condition: service_healthy
      owc-tools-playwright:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  owc-web:
    image: ${OWC_WEB_IMAGE:-open-web-catcher-web}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_WEB_CONTAINER:-owc-web}
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      API_BASE_URL: http://owc:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      owc:
        condition: service_healthy

volumes:
  postgres_data:
