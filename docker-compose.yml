# Open Web Catcher app stack with separate Puppeteer/MCP tooling.

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owc}
      POSTGRES_DB: ${POSTGRES_DB:-owc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owc} -d ${POSTGRES_DB:-owc}"]
      interval: 10s
      timeout: 5s
      retries: 10

  owc-tools:
    image: ${OWC_TOOLS_IMAGE:-open-web-catcher-tools}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.tools
      cache_to:
        - type=inline
      cache_from:
        - ${OWC_TOOLS_IMAGE:-open-web-catcher-tools}:${OWC_TAG:-latest}
    container_name: ${OWC_TOOLS_CONTAINER:-owc-tools}
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "3000:3000"
      - "9222:9222"
    env_file:
      - .env
    environment:
      PORT: 3000
      MCP_BROWSER_MODE: ${MCP_BROWSER_MODE:-isolated}
      BROWSER_WS_ENDPOINT: ws://127.0.0.1:9222
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/google-chrome-stable
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  owc:
    image: ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      cache_to:
        - type=inline
      cache_from:
        - ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    container_name: ${OWC_CONTAINER:-owc}
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "7860:7860"
    env_file:
      - .env
    environment:
      BROWSER_WS_ENDPOINT: ws://owc-tools:9222
      MCP_SERVER_URL: http://owc-tools:3000
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-owc}:${POSTGRES_PASSWORD:-owc}@postgres:5432/${POSTGRES_DB:-owc}
      PHOENIX_TRACING: ${PHOENIX_TRACING:-true}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-open-web-catcher}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT_DOCKER:-http://phoenix:6006}
      PHOENIX_UI_URL: ${PHOENIX_UI_URL:-http://localhost:6006}
      PHOENIX_BASE_URL: ${PHOENIX_BASE_URL_DOCKER:-http://phoenix:6006}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    depends_on:
      phoenix:
        condition: service_started
      postgres:
        condition: service_healthy
      owc-tools:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  phoenix_data:
  postgres_data:
