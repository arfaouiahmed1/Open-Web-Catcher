version: "3.9"

# Single all-in-one container.
# PostgreSQL, Chrome, MCP server, FastAPI, and Gradio all run inside it
# under supervisord.  Use scripts/ for build/start/stop/restart/clean/test.

services:
  owc:
    image: ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    container_name: owc
    restart: unless-stopped
    shm_size: "2gb"          # Chrome needs shared memory
    ports:
      - "8000:8000"          # FastAPI
      - "7860:7860"          # Gradio
    env_file:
      - .env
    environment:
      # Internal service defaults (override in .env if needed)
      BROWSER_WS_ENDPOINT: ws://localhost:9222
      MCP_SERVER_URL: http://localhost:3000
      DATABASE_URL: postgresql+psycopg2://owc:owc@localhost:5432/owc
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_PROJECT: open-web-catcher
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
