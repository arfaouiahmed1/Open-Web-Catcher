# Open Web Catcher app stack with Playwright MCP tooling and Next.js operator console.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owc}
      # Required, no weak default: compose fails fast when unset (set it in .env).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_must_be_set_in_.env}
      POSTGRES_DB: ${POSTGRES_DB:-owc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owc} -d ${POSTGRES_DB:-owc}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    # Run-state store only: internal network, never host-published (plan T17/ADR-002).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: '0.5'
        reservations:
          memory: 128m

  owc-tools-playwright:
    image: ${OWC_TOOLS_PW_IMAGE:-open-web-catcher-tools-playwright}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.tools.playwright
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_TOOLS_PW_CONTAINER:-owc-tools-playwright}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    shm_size: "2gb"
    ports:
      - "${OWC_TOOLS_PW_HOST_PORT:-3002}:3001"
      # Map host debug port to the sidecar's network-visible CDP proxy. Chrome
      # itself intentionally remains bound to its private loopback 9223.
      - "${OWC_TOOLS_PW_DEBUG_HOST_PORT:-9223}:9224"
    env_file:
      - .env
    environment:
      # HOST=0.0.0.0 is required for cross-container reachability: the MCP server
      # defaults to 127.0.0.1 (safe for host runs), but owc probes
      # http://owc-tools-playwright:3001 over the compose network.
      PORT: 3001
      HOST: 0.0.0.0
      # Chrome CDP must be reachable by owc over the compose network; local runs
      # still default to 127.0.0.1 in the entrypoint when this is unset.
      REMOTE_DEBUGGING_ADDRESS: 0.0.0.0
      MCP_BROWSER_MODE: ${MCP_BROWSER_MODE:-isolated}
      BROWSER_WS_ENDPOINT: ws://127.0.0.1:9223
      # uBOL adblock options (OWC_UBOL_*) are baked into the image ENV; override
      # them here only if needed.
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '3.0'
        reservations:
          memory: 1g

  # Opt-in headed Playwright tools under Xvfb: `docker compose --profile headed-playwright up`.
  # Same image as owc-tools-playwright with OWC_BROWSER_HEADLESS=false; host
  # ports offset (3012/9323) so the default headless service keeps 3002/9223.
  owc-tools-playwright-headed:
    image: ${OWC_TOOLS_PW_IMAGE:-open-web-catcher-tools-playwright}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.tools.playwright
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_TOOLS_PW_HEADED_CONTAINER:-owc-tools-playwright-headed}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    shm_size: "2gb"
    profiles:
      - headed-playwright
    ports:
      - "${OWC_TOOLS_PW_HEADED_HOST_PORT:-3012}:3001"
      - "${OWC_TOOLS_PW_HEADED_DEBUG_HOST_PORT:-9323}:9224"
    env_file:
      - .env
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      # Chrome CDP must be reachable by owc over the compose network; local runs
      # still default to 127.0.0.1 in the entrypoint when this is unset.
      REMOTE_DEBUGGING_ADDRESS: 0.0.0.0
      MCP_BROWSER_MODE: ${MCP_BROWSER_MODE:-isolated}
      BROWSER_WS_ENDPOINT: ws://127.0.0.1:9223
      OWC_BROWSER_HEADLESS: "false"
      OWC_XVFB_SCREEN: ${OWC_XVFB_SCREEN:-1280x800x24}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '3.0'
        reservations:
          memory: 1g

  owc:
    image: ${OWC_IMAGE:-open-web-catcher}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_CONTAINER:-owc}
    restart: unless-stopped
    init: true
    user: "0:0"
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The sidecar forwards its private Chrome CDP on 9224 for compose peers.
      BROWSER_WS_ENDPOINT: ws://owc-tools-playwright:9224
      MCP_SERVER_URL: http://owc-tools-playwright:3001
      MCP_SERVER_URL_PLAYWRIGHT: http://owc-tools-playwright:3001
      # Composed from the required POSTGRES_PASSWORD (no baked owc:owc creds).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-owc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_must_be_set_in_.env}@postgres:5432/${POSTGRES_DB:-owc}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OBSERVABILITY_PROJECT_NAME: ${OBSERVABILITY_PROJECT_NAME:-open-web-catcher}
      OBSERVABILITY_DEFAULT_DATASET_NAME: ${OBSERVABILITY_DEFAULT_DATASET_NAME:-open-web-catcher-runs}
      OBSERVABILITY_DATASET_DIR: ${OBSERVABILITY_DATASET_DIR:-data/datasets}
      MODEL_PRICING_JSON: ${MODEL_PRICING_JSON:-{}}
      # Support the Docker console port and the standard Next dev port. Keeping
      # the list explicit prevents wildcard CORS while avoiding a misleading
      # browser-level "Could not reach API" when a developer opens :3000.
      UI_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:${OWC_WEB_HOST_PORT:-3000},http://127.0.0.1:${OWC_WEB_HOST_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      owc-tools-playwright:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./datasets:/app/datasets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: '2.0'
        reservations:
          memory: 512m

  owc-web:
    image: ${OWC_WEB_IMAGE:-open-web-catcher-web}:${OWC_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_to:
        - type=inline
    container_name: ${OWC_WEB_CONTAINER:-owc-web}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "${OWC_WEB_HOST_PORT:-3000}:3001"
    environment:
      API_BASE_URL: http://owc:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      owc:
        condition: service_healthy
    healthcheck:
      # /api/health is proxied by next.config rewrites to the backend /health.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 128m

volumes:
  postgres_data:
